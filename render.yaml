services:
  - type: web
    name: autonomos-text2sql-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: autonomos-text2sql-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 18.20.4
      - key: API_HOSTPORT
        fromService:
          type: web
          name: autonomos-text2sql-api
          property: hostport
